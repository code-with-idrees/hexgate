[build-system]
requires = ["hatchling>=1.32.4"]
build-backend = "hatchling.build"

[project]
name = "hexgate"
version = "1.0.0"
description = "A resilient local model gateway for coding agents. One endpoint, every provider, zero wasted retries."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "Muhammad Idrees" }]
keywords = ["llm", "gateway", "proxy", "claude-code", "openai", "anthropic", "ai"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Environment :: Web Environment",
  "Framework :: FastAPI",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Utilities",
]
dependencies = [
  "fastapi>=0.156.8",
  "uvicorn[standard]>=0.54.0",
  "httpx>=0.28.1",
  "cryptography>=50.0.2",
]

[project.optional-dependencies]
dev = [
  "pytest>=9.1.1",
  "pytest-asyncio>=1.4.0",
  "ruff>=0.17.1",
]

[project.scripts]
hexgate = "hexgate.cli:main"
hg = "hexgate.cli:main"

[project.urls]
Homepage = "https://github.com/code-with-idrees/hexgate"
Documentation = "https://github.com/code-with-idrees/hexgate/tree/main/docs"
Issues = "https://github.com/code-with-idrees/hexgate/issues"
Changelog = "https://github.com/code-with-idrees/hexgate/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["hexgate"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501", "B008"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]
